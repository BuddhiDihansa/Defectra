[project]
name = "defectra"
version = "0.1.0"
description = "AI-Powered Industrial Quality Inspection & Anomaly Detection Platform"
authors = [
    {name = "BuddhiDihansa", email = "buddhidihansa@gmail.com"}
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/BuddhiDihansa/Defectra"
Repository = "https://github.com/BuddhiDihansa/Defectra"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends.legacy:build"